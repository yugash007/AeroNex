# Release APKs, as 0.4.0 shipped them: one APK for both ARM ABIs and one per ABI, each checked by
# tools/check_android_package.py. They are signed with the project's development key, certificate 6313b3f8…43c1, so they
# install over every earlier release and keep its downloaded models and data. That key is the repository secret
# ANDROID_DEBUG_KEYSTORE_BASE64: the base64 of the debug.keystore that signed the earlier releases. Without it, or with
# another key, the build stops before compiling anything.
#
# Run it from the Actions tab on main, or push a tag vX.Y.Z matching app/pubspec.yaml. Either publishes the GitHub release
# vX.Y.Z with the APKs and SHA256SUMS, which the README's Download section links to; running it again for the same
# version replaces its APKs. A run on another branch only keeps the APKs as the run's artifact.
#
# A manual run with "test_key" builds the same APKs, named *-test.apk, signed with a temporary key made for that run. They
# install only where AeroNex is not installed (or after uninstalling it, which deletes its models and data), and they are
# never published: only the run's artifact keeps them.
name: Release APK

on:
  workflow_dispatch:
    inputs:
      test_key:
        description: "Test build with a temporary key (cannot update an installed AeroNex; never published)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build and check the release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CERTIFICATE_SHA256: 6313b3f87ccfd799e2c4a96d2de6796836f3559fce9a0b4ab3974456b9d243c1
      SHERPA_AAR_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
      SHERPA_AAR_SHA256: 633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96
      # The AI libraries' sources, as app/android/app/src/main/cpp/CMakeLists.txt pins them.
      LLAMA_COMMIT: fc9ce6b9d52a8504edcb262abc92737c2289f96c
      NEEDLE_URL: https://huggingface.co/Cactus-Compute/needle3/resolve/2ae11323dc000f5e70c49f7403efa6af12ba9e67/android-arm64/libneedle.a
      NEEDLE_SHA256: 4522a16eebaaf569ebacd0ac682712a8d91acc88a2a50a44fd65f332c8ebfdbb
      # "test" for a test_key run, else "release": the APK names, and whether anything is published.
      KIND: ${{ inputs.test_key && 'test' || 'release' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Version from app/pubspec.yaml
        id: version
        run: |
          version=$(sed -n 's/^version: *//p' app/pubspec.yaml)
          name=${version%+*}
          code=${version#*+}
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$code" =~ ^[0-9]+$ ]]; then
            echo "::error::app/pubspec.yaml version '$version' is not X.Y.Z+N"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/pubspec.yaml version $name"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Signing key (the earlier releases' key, or no build)
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          # The release build type signs with the keystore named by AERONEX_KEYSTORE (app/android/app/build.gradle.kts).
          keystore="$RUNNER_TEMP/aeronex-signing.keystore"
          echo "AERONEX_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          certificate() {
            keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey 2>&1 \
              | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f'
          }
          if [ "$KIND" = test ]; then
            keytool -genkeypair -keystore "$keystore" -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=AeroNex test build" -keyalg RSA -keysize 2048 -validity 365
            digest=$(certificate)
            echo "CERTIFICATE_SHA256=$digest" >> "$GITHUB_ENV" # what the checker expects in this run
            echo "::warning::Test build signed with a temporary key ($digest): it cannot update an installed AeroNex, and it is never published."
            exit 0
          fi
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the repository secret ANDROID_DEBUG_KEYSTORE_BASE64: the base64 of the debug.keystore that signed the earlier releases."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$keystore"
          digest=$(certificate)
          if [ "$digest" != "$CERTIFICATE_SHA256" ]; then
            echo "::error::The keystore's certificate is '${digest:-unreadable}', not the earlier releases' $CERTIFICATE_SHA256."
            exit 1
          fi
          echo "Signing with the development key $CERTIFICATE_SHA256"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true
      - uses: gradle/actions/setup-gradle@v4

      # The build reads these from ../tooling, next to the checkout (the Gradle defaults).
      - name: Fetch the pinned native inputs and check their digests
        run: |
          tooling="$(dirname "$GITHUB_WORKSPACE")/tooling"
          mkdir -p "$tooling/sherpa-onnx" "$tooling/cactus" "$tooling/llama.cpp"
          curl -fsSL --retry 3 -o "$tooling/sherpa-onnx/sherpa-onnx-1.13.8.aar" "$SHERPA_AAR_URL"
          echo "$SHERPA_AAR_SHA256  $tooling/sherpa-onnx/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          curl -fsSL --retry 3 -o "$tooling/cactus/android-arm64-libneedle.a" "$NEEDLE_URL"
          echo "$NEEDLE_SHA256  $tooling/cactus/android-arm64-libneedle.a" | sha256sum -c -
          curl -fsSL --retry 3 "https://github.com/ggml-org/llama.cpp/archive/$LLAMA_COMMIT.tar.gz" \
            | tar -xz --strip-components=1 -C "$tooling/llama.cpp"
          test -f "$tooling/llama.cpp/include/llama.h"

      - name: Build (both ARM ABIs in one APK, and one APK per ABI)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Check the APKs (identity, key, ABIs, 16 KiB alignment, JNI contract, licence notices)
        id: check
        run: |
          # The checker needs aapt (badging), apksigner, and a zipalign with -P (16 KiB pages, build-tools 35+): the newest
          # installed build-tools that has all three, else 35.0.0.
          pick() {
            for dir in $(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -rV); do
              if [ -x "$dir/aapt" ] && [ -f "$dir/lib/apksigner.jar" ] && "$dir/zipalign" 2>&1 | grep -q -- '-P'; then
                echo "$dir"
                return
              fi
            done
          }
          tools=$(pick)
          if [ -z "$tools" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" > /dev/null
            tools=$(pick)
          fi
          if [ -z "$tools" ]; then
            echo "::error::No build-tools with aapt, apksigner and a 16 KiB zipalign (-P)."
            exit 1
          fi
          echo "Checking with $tools"
          out=app/build/app/outputs/flutter-apk
          name=${{ steps.version.outputs.name }}
          code=${{ steps.version.outputs.code }}
          mkdir -p dist
          failed=0
          check() { # built APK, ABIs, version code, release name, extra checker flags
            cp "$out/$1" "dist/$4.apk"
            if python3 tools/check_android_package.py "dist/$4.apk" --build-tools "$tools" --version "$name" \
                --version-code "$3" --certificate "$CERTIFICATE_SHA256" --abis "$2" --report "dist/$4.json" $5 \
                > "dist/$4.out" 2>&1; then
              cat "dist/$4.out"
            else
              cat "dist/$4.out"
              # Annotations are what the run page (and the API) show without the full log.
              echo "::error title=$4 failed the check::$(tail -n 4 "dist/$4.out" | tr '\n' ' ' | cut -c1-900)"
              if [ -f "dist/$4.log" ]; then
                echo "::error title=$4 tool output::$(tail -n 6 "dist/$4.log" | tr '\n' ' ' | cut -c1-900)"
              fi
              failed=1
            fi
          }
          # Split APKs number their versions per ABI as Flutter does: 1000 for armeabi-v7a, 2000 for arm64-v8a.
          check app-release.apk armeabi-v7a,arm64-v8a "$code" "aeronex-$name-$KIND" --require-ai-notices
          check app-armeabi-v7a-release.apk armeabi-v7a "$((1000 + code))" "aeronex-$name-armeabi-v7a-$KIND" ""
          check app-arm64-v8a-release.apk arm64-v8a "$((2000 + code))" "aeronex-$name-arm64-v8a-$KIND" --require-ai-notices
          (cd dist && sha256sum *.apk | tee SHA256SUMS)
          exit $failed

      # Kept even when a check fails, named so: to see what was built.
      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outcome != 'skipped'
        with:
          name: aeronex-${{ steps.version.outputs.name }}-${{ env.KIND }}-apks${{ steps.check.outcome == 'failure' && '-FAILED-CHECK' || '' }}
          path: dist/
          if-no-files-found: error

      - name: GitHub release vX.Y.Z (main or a tag)
        if: (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch) && env.KIND == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name=${{ steps.version.outputs.name }}
          tag="v$name"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.apk dist/SHA256SUMS --target "$GITHUB_SHA" --title "AeroNex $name" \
              --notes "AeroNex $name for Android 8.0 and newer. Most phones: aeronex-$name-arm64-v8a-release.apk (needed for the on-device AI). Older 32-bit phones: aeronex-$name-armeabi-v7a-release.apk. Not sure: aeronex-$name-release.apk works on both. Every APK passed tools/check_android_package.py and is signed with the development key (certificate ${CERTIFICATE_SHA256:0:8}…), so it installs over earlier releases and keeps their models and data. SHA-256 sums: SHA256SUMS."
          fi
