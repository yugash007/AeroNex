# Lexicon: Tamil (ta). Canonical grammar v1 (spec 4.8, 7.2).
#
# PROVISIONAL as a whole (spec 7.2): no native speaker has reviewed it.
# `rules` is the edge/app/intent.py reference table (verbatim, in order); the
# v0.2.0 Dart parser had no Tamil vocabulary, so these tables feed the CTC
# lexicon, not the golden-parity parser. `plan.connectives` and the
# `transcript` negators are the Dart tables' Tamil entries.

language: ta
name: Tamil
script: {name: tamil, first: 0x0B80, last: 0x0BFF, digit_zero: 0x0BE6}
provisional: true

rules:
  move_verbs: [செல், செல்லு, போ, பற, நகர்]
  directions:
    forward: [முன்னால், முன்னோக்கி]
    backward: [பின்னால், பின்னோக்கி]
    left: [இடதுபுறம், இடது]
    right: [வலதுபுறம், வலது]
    up: [மேலே, மேல்நோக்கி]
    down: [கீழே, கீழ்நோக்கி]
  units: [மீட்டர், மீட்டர்கள், மீ]
  commands:
    - {command: STOP, phrases: [நில், நிறுத்து, ஸ்டாப்]}
    - {command: TAKEOFF, phrases: [டேக்ஆஃப், புறப்படு, மேலே எழு]}
    - {command: LAND, phrases: [தரையிறங்கு, லேண்ட்]}
    - {command: HOVER, phrases: [ஹோவர்]}
  negators: [வேண்டாம், இல்லை]
  negator_suffixes: [வேண்டாம், கூடாது]
  minus_words: [மைனஸ்]
  other_units: [சென்டிமீட்டர், மில்லிமீட்டர், கிலோமீட்டர், சென்டி, மில்லி, கிலோ, அடி, அங்குலம், மைல்]
  scale_words: [நூற்று, ஆயிரம், புள்ளி, அரை]
  numbers: {ஒரு: 1, ஒன்று: 1, இரண்டு: 2, மூன்று: 3, நான்கு: 4, ஐந்து: 5, ஆறு: 6, ஏழு: 7, எட்டு: 8, ஒன்பது: 9, பத்து: 10, பதினொன்று: 11, பன்னிரண்டு: 12, பதிமூன்று: 13, பதினான்கு: 14, பதினைந்து: 15, பதினாறு: 16, பதினேழு: 17, பதினெட்டு: 18, பத்தொன்பது: 19, இருபது: 20, இருபத்தி: 20, முப்பது: 30, முப்பத்தி: 30, நாற்பது: 40, நாற்பத்தி: 40, ஐம்பது: 50, ஐம்பத்தி: 50, அறுபது: 60, அறுபத்தி: 60, எழுபது: 70, எழுபத்தி: 70, எண்பது: 80, எண்பத்தி: 80, தொண்ணூறு: 90, தொண்ணூற்றி: 90, நூறு: 100}
  tens_values: [20, 30, 40, 50, 60, 70, 80, 90]
  units19: {ஒரு: 1, ஒன்று: 1, இரண்டு: 2, மூன்று: 3, நான்கு: 4, ஐந்து: 5, ஆறு: 6, ஏழு: 7, எட்டு: 8, ஒன்பது: 9}

plan:
  connectives: [பிறகு, மற்றும்]

transcript:
  negators: [இல்லை]
  fused_negators: [வேண்டாம், கூடாது]

# --- v2 grammar ---------------------------------------------------------------

stop_lane: [நில், நிறுத்து, ஸ்டாப்]

numerals:
  extra: {பூஜ்ஜியம்: 0}
  fractions: {அரை: 0.5, ஒன்றரை: 1.5, இரண்டரை: 2.5}
  loans:
    ones: {ஜீரோ: 0, ஒன்: 1, டூ: 2, த்ரீ: 3, ஃபோர்: 4, ஃபைவ்: 5, சிக்ஸ்: 6, செவன்: 7, எய்ட்: 8, நைன்: 9, டென்: 10, லெவன்: 11, ட்வெல்வ்: 12, தர்டீன்: 13, ஃபோர்டீன்: 14, ஃபிஃப்டீன்: 15, சிக்ஸ்டீன்: 16, செவன்டீன்: 17, எய்டீன்: 18, நைன்டீன்: 19}
    tens: {ட்வென்டி: 20, தர்ட்டி: 30, ஃபோர்ட்டி: 40, ஃபிஃப்டி: 50, சிக்ஸ்டி: 60, செவன்டி: 70, எய்ட்டி: 80, நைன்டி: 90}
    hundred: {ஹன்ட்ரட்: 100}
    fractions: {ஹாஃப்: 0.5}

loanwords:
  words:
    - {loan: டேக் ஆஃப், latin: take off, class: takeoff, native: டேக்ஆஃப்}
    - {loan: ஹோல்ட், latin: hold, class: hold, native: ஹோவர்}
    - {loan: ஃபார்வர்ட், latin: forward, class: dir, native: முன்னால்}
    - {loan: பேக், latin: back, class: dir, native: பின்னால்}
    - {loan: லெஃப்ட், latin: left, class: dir, native: இடது}
    - {loan: ரைட், latin: right, class: dir, native: வலது}
    - {loan: அப், latin: up, class: dir, native: மேலே}
    - {loan: டவுன், latin: down, class: dir, native: கீழே}
    - {loan: மூவ், latin: move, class: verb, native: செல்}
    - {loan: கோ, latin: go, class: verb, native: செல்}
    - {loan: மீட்டர்ஸ், latin: meters, class: unit, native: மீட்டர்}
    - {loan: ஸ்டேட்டஸ், latin: status, class: status, native: null}

templates:
  takeoff: ["{num} {unit} {takeoff}"]
  move: ["{num} {unit} {dir} {verb}", "{dir} {num} {unit} {verb}"]
  hold: ["{hold}"]
  stop: ["{stop}"]
  land: ["{land}"]
  status: ["{status}"]
