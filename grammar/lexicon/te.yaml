# Lexicon: Telugu (te). Canonical grammar v1 (spec 4.8, 7.2).
#
# `rules`, `plan` and `transcript` are the v0.2.0 Dart tables, verbatim and in
# source order (golden parity, see en.yaml). Entries the Dart source marks
# PROVISIONAL (needs native-speaker review) are `provisional: true` here; the
# v2 additions (zero, halves, English loanwords in Telugu script) are too.

language: te
name: Telugu
script: {name: telugu, first: 0x0C00, last: 0x0C7F, digit_zero: 0x0C66}
provisional: false

rules:
  move_verbs: [వెళ్ళు, వెళ్లు, వెళ్ళండి, వెళ్లండి, పంపు, పంపండి, కదులు]
  directions:
    forward: [ముందుకు]
    backward: [వెనక్కి, వెనుకకు]
    left: [ఎడమకు, ఎడమవైపుకు, ఎడమ వైపుకు, ఎడమ]
    right: [కుడికి, కుడివైపుకు, కుడి వైపుకు, కుడి]
    up: [పైకి]
    down: [కిందికి, క్రిందికి]
  units: [మీటర్లు, మీటర్ల, మీటరు, మీటర్]
  commands:
    - {command: STOP, phrases: [ఆపు, ఆగు, స్టాప్]}
    - {command: TAKEOFF, phrases: [టేకాఫ్, పైకి లే]}
    - {command: LAND, phrases: [ల్యాండ్, దిగు]}
    - {command: HOVER, phrases: [హోవర్]}
  negators: {provisional: true, words: [వద్దు, చేయకు, చేయకండి, చెయ్యకు, చెయ్యకండి, కాదు, ఎగరవద్దు, ఎగరకు, లేదు]}
  negator_suffixes: {provisional: true, words: [వద్దు, వద్దండి, ొద్దు, ొద్దండి]}
  minus_words: {provisional: true, words: [మైనస్]}
  other_units: {provisional: true, words: [సెంటీమీటర్లు, సెంటీమీటర్, మిల్లీమీటర్లు, మిల్లీమీటర్, కిలోమీటర్లు, కిలోమీటర్, సెంటీ, మిల్లీ, కిలో, అడుగులు, అడుగు, అంగుళాలు, అంగుళం, గజాలు, మైళ్ళు, మైలు]}
  scale_words: {provisional: true, words: [వందల, వందలు, వేయి, వెయ్యి, వేల, వేలు, దశాంశం, అర]}
  numbers: {ఒక: 1, ఒకటి: 1, రెండు: 2, మూడు: 3, నాలుగు: 4, ఐదు: 5, ఆరు: 6, ఏడు: 7, ఎనిమిది: 8, తొమ్మిది: 9, పది: 10, పదకొండు: 11, పన్నెండు: 12, పదమూడు: 13, పద్నాలుగు: 14, పదిహేను: 15, పదహారు: 16, పదిహేడు: 17, పద్దెనిమిది: 18, పందొమ్మిది: 19, ఇరవై: 20, ముప్పై: 30, నలభై: 40, యాభై: 50, అరవై: 60, డెబ్బై: 70, ఎనభై: 80, తొంభై: 90, వంద: 100, నూరు: 100}
  # A tens word followed by a units19 word adds up ("ఇరవై మూడు" = 23).
  tens_values: [20, 30, 40, 50, 60, 70, 80, 90]
  units19: {ఒక: 1, ఒకటి: 1, రెండు: 2, మూడు: 3, నాలుగు: 4, ఐదు: 5, ఆరు: 6, ఏడు: 7, ఎనిమిది: 8, తొమ్మిది: 9}

plan:
  provisional: true
  connectives:
    words: [{w: ఆ తర్వాత, provisional: false}, {w: తర్వాత, provisional: false}, {w: తరువాత, provisional: false}, {w: మరియు, provisional: false}, అప్పుడు]
  first_words: [ముందుగా, ముందు, మొదటగా, మొదట]
  courtesy: [దయచేసి, సరే, అలాగే, డ్రోన్, హే, హలో, హాయ్, ఓకే, ప్లీజ్]
  motion_verbs: {same_as: rules.move_verbs}
  fractions: [సగం, పావు, ముప్పావు]
  # StepParser._otherUnits: oblique "of feet/inches".
  other_units: [అడుగుల, అంగుళాల]
  measure_words: [సెకను, సెకన్లు, సెకన్ల, సెకండ్, సెకండ్లు, సెకండ్ల, నిమిషం, నిమిషాలు, నిమిషాల, గంట, గంటలు, గంటల, డిగ్రీ, డిగ్రీలు, డిగ్రీల, పాటు, ప్రతి, వేగం]
  sequence_words: [సార్లు, సారి, ముందు, తర్వాత, తరువాత, వరకు]
  indic_filler: [ఇప్పుడు, ఇప్పుడే, దయచేసి, నెమ్మదిగా, కొంచెం, వైపు, డ్రోన్, "డ్రోన్‌ను", డ్రోన్ను, "డ్రోన్‌ని", డ్రోన్ని, మీరు, నువ్వు, సరే, అలాగే, హే, హలో, హాయ్, ఓకే, ప్లీజ్, చేయి, చెయ్యి, చేయండి, అవ్వు, అవ్వండి]
  straight_words: [నేరుగా]
  more_words: [ఇంకా, ఇంకో, మరో, మరొక]
  hedge_words: [సుమారు, దాదాపు, లేదా]
  altitude_words: [ఎత్తు, ఎత్తుకు, వరకు]
  takeoff_words: [ఎత్తు, ఎత్తుకు]
  simple_words: [వెంటనే, ఇక్కడే, ఇక్కడ, సురక్షితంగా, గాలిలో]
  land_words: {same_as: rules.directions.down}

transcript:
  provisional: true
  negators: [కాదు, లేదు]
  # Matched anywhere in the transcript: negation fused onto the verb.
  fused_negators: [వద్దు, చేయకు, ఎగరవద్దు, ఎగరకు]
  # Arabic-script blocks: a Telugu transcript in them is sent back for review.
  foreign_scripts: [[0x0600, 0x06FF], [0x0750, 0x077F], [0x08A0, 0x08FF], [0xFB50, 0xFDFF], [0xFE70, 0xFEFF]]

# --- v2 grammar ---------------------------------------------------------------

# Negative imperatives of the te command verbs that the te model can emit, so
# "ముందుకు వెళ్ళకు" ("don't go forward") decodes as itself and is refused, never
# heard as the move verb వెళ్ళు (spec 4.8; README "Negation in the grammar").
# The -వద్దు/-ొద్దు forms are refused as rules.negator_suffixes; the -కు,
# -కండి, -కూడదు and -ద్దు forms are words no parser table reads, so the clause
# has no rule reading and is rejected (v2 has no AI fallback). "Don't stop"
# (ఆపకు, ఆగవద్దు) is left out on purpose: a STOP is never absorbed by a
# negated form.
grammar_negators:
  provisional: true
  words: [వెళ్ళకు, వెళ్ళకండి, వెళ్ళవద్దు, వెళ్ళకూడదు, వెళ్లకు, వెళ్లకండి, వెళ్లవద్దు, వెళ్లొద్దు, వెళ్లకూడదు, పంపకండి, పంపవద్దు, పంపకూడదు, దిగకూడదు, చేయవద్దు, చేయద్దు, చేయొద్దు, చేయకూడదు, చెయ్యవద్దు, చెయ్యద్దు, చెయ్యకూడదు]

stop_lane: {provisional: true, words: [ఆపు, ఆగు, స్టాప్]}

numerals:
  provisional: true
  extra: {సున్నా: 0}
  fractions: {అర: 0.5, సగం: 0.5, ఒకటిన్నర: 1.5, రెండున్నర: 2.5}
  loans:
    ones: {జీరో: 0, వన్: 1, టూ: 2, త్రీ: 3, ఫోర్: 4, ఫైవ్: 5, సిక్స్: 6, సెవెన్: 7, ఎయిట్: 8, నైన్: 9, టెన్: 10, ఎలెవెన్: 11, ట్వెల్వ్: 12, థర్టీన్: 13, ఫోర్టీన్: 14, ఫిఫ్టీన్: 15, సిక్స్టీన్: 16, సెవెంటీన్: 17, ఎయిటీన్: 18, నైన్టీన్: 19}
    tens: {ట్వెంటీ: 20, థర్టీ: 30, ఫోర్టీ: 40, ఫిఫ్టీ: 50, సిక్స్టీ: 60, సెవెంటీ: 70, ఎయిటీ: 80, నైంటీ: 90}
    hundred: {హండ్రెడ్: 100}
    fractions: {హాఫ్: 0.5}

loanwords:
  provisional: true
  words:
    - {loan: టేక్ ఆఫ్, latin: take off, class: takeoff, native: టేకాఫ్}
    - {loan: లాంచ్, latin: launch, class: takeoff, native: టేకాఫ్}
    - {loan: హోల్డ్, latin: hold, class: hold, native: హోవర్}
    - {loan: ఫార్వర్డ్, latin: forward, class: dir, native: ముందుకు}
    - {loan: బ్యాక్, latin: back, class: dir, native: వెనక్కి}
    - {loan: లెఫ్ట్, latin: left, class: dir, native: ఎడమకు}
    - {loan: రైట్, latin: right, class: dir, native: కుడికి}
    - {loan: అప్, latin: up, class: dir, native: పైకి}
    - {loan: డౌన్, latin: down, class: dir, native: కిందికి}
    - {loan: మూవ్, latin: move, class: verb, native: వెళ్ళు}
    - {loan: గో, latin: go, class: verb, native: వెళ్ళు}
    - {loan: మీటర్స్, latin: meters, class: unit, native: మీటర్లు}
    - {loan: స్టేటస్, latin: status, class: status, native: null}

templates:
  takeoff: ["{num} {unit} {takeoff}", "{num} {unit} వరకు {takeoff}"]
  move: ["{num} {unit} {dir} {verb}", "{dir} {num} {unit} {verb}"]
  hold: ["{hold} [చేయి]"]
  stop: ["{stop}"]
  land: ["{land}"]
  status: ["{status}"]

vosk:
  # Not in the te model vocabulary (gen.py fails on any other missing word).
  exclude: [ఎగరకు, ఎగరవద్దు, డ్రోన్ని, డ్రోన్ను, దశాంశం]
  # The model lacks most English loan teens and tens (థర్టీన్, ఫోర్టీ, ...);
  # a partial loan set can force "thirteen" onto త్రీ (3). So the te Vosk
  # grammar has no loan numerals; the native 0-100 are complete.
  loan_numerals: false
  # Never fillers: spelling variants of numerals (అయిదు = ఐదు, సున్న, ఒక్క, ...)
  # so the spoken number decodes as the numeral (README "Fillers").
  filler_exclude: ["అయిదు", "పదునయిదు", "పధ్ధెనిమిది", "పధ్నాలుగు", "సున్న", "ఒక్క"]
  # Acoustic neighbours of ఆపు, ఆగు and స్టాప్: never fillers and never decoys in
  # stop_te.json (README "Stop lane and keyword spotting"): ఆరు (6) and the loan
  # అప్ (up) differ from ఆపు/ఆగు by one sound, స్టార్ from స్టాప్.
